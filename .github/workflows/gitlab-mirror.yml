name: Mirror to GitLab

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact existing tag to recover (for example v0.18.33)'
        required: true
        type: string
      expected_old_sha:
        description: 'Exact current GitLab tag object; mismatch aborts'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mirror branches and tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_SSH_PRIVATE_KEY: ${{ secrets.GITLAB_MIRROR_SSH_KEY }}
          EVENT_BEFORE: ${{ github.event.before }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_OLD_SHA: ${{ inputs.expected_old_sha }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GITLAB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' 'gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf' > "$HOME/.ssh/known_hosts"

          git clone --bare \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            mirror.git
          target="git@gitlab.com:adolftwn-backup/${GITHUB_REPOSITORY#*/}.git"
          # BEGIN leased tag replacement: an accepted tag update or explicit recovery.
          tag_ref="$GITHUB_REF"
          expected_old="$EVENT_BEFORE"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag_ref="refs/tags/$REQUESTED_TAG"
            expected_old="$REQUESTED_OLD_SHA"
          fi
          if [[ "$tag_ref" == refs/tags/* ]] && [ "$expected_old" != 0000000000000000000000000000000000000000 ]; then
            git check-ref-format "$tag_ref"
            [[ "$expected_old" =~ ^[0-9a-f]{40}$ ]]
            current=$(git ls-remote "$target" "$tag_ref" | cut -f1)
            desired=$(git -C mirror.git rev-parse "$tag_ref")
            if [ "$current" != "$desired" ]; then
              git -C mirror.git push --force-with-lease="$tag_ref:$expected_old" \
                "$target" "$tag_ref:$tag_ref"
            fi
          fi
          # END leased tag replacement.
          git -C mirror.git push \
            "git@gitlab.com:adolftwn-backup/${GITHUB_REPOSITORY#*/}.git" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
          git -C mirror.git ls-remote --heads --tags origin | sort > github-refs.txt
          git ls-remote --heads --tags \
            "git@gitlab.com:adolftwn-backup/${GITHUB_REPOSITORY#*/}.git" \
            | sort > gitlab-refs.txt
          diff -u github-refs.txt gitlab-refs.txt
          echo "Verified: GitHub and GitLab branch/tag references match."
