name: Mirror to GitLab

on:
  push:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mirror branches and tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_SSH_PRIVATE_KEY: ${{ secrets.GITLAB_MIRROR_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GITLAB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' 'gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf' > "$HOME/.ssh/known_hosts"

          git clone --bare \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            mirror.git
          git -C mirror.git push \
            "git@gitlab.com:adolftwn-backup/${GITHUB_REPOSITORY#*/}.git" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
