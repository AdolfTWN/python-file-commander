[window]
geometry = 1200x720

[state]
active_panel = left

[view]
font_size = small

[left]
tabs = ["~"]
selected = 0
sort_column = name
sort_descending = false
show_hidden = false
show_system = false

[right]
tabs = ["~"]
selected = 0
sort_column = name
sort_descending = false
show_hidden = false
show_system = false

[hotkeys]
rename = <F2>
preview = <F3>
search = <F4>
copy = <F5>
move = <F6>
new_folder = <F7>
delete = <Delete>
refresh = <Control-r>
enter_folder = <Right>
parent_folder = <Left>
new_tab = <Control-Up>
close_tab = <Control-w>
select_all = <Control-a>
copy_path = <Control-Shift-C>
toggle_hidden = <Control-h>
compare = <F9>

[compare]
geometry = 1400x850

[refresh]
auto_refresh = true
active_interval_ms = 2000
background_interval_ms = 10000
network_interval_ms = 5000

[tab_colors]
colors = {}

